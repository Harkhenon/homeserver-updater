name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construire le tarball du couple
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash make-release.sh "$VERSION" "0.5.0"

      - name: Publier la release avec les assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes "Couple updater v$VERSION — core + updater avec réparation mutuelle." \
            dist/homeserver-updater-$VERSION.tar.gz \
            dist/homeserver-updater-$VERSION.tar.gz.sha256
